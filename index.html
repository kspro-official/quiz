<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>KS-PRO 안전 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --navy: #0f172a; --primary: #1e3a8a; --accent: #2563eb; --accent-soft: #eff6ff;
    --orange: #ea580c; --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
    --ok: #16a34a; --ok-soft: #f0fdf4; --bad: #dc2626; --bad-soft: #fef2f2;
    --radius: 20px; --shadow: 0 10px 30px -12px rgba(15, 23, 42, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55; letter-spacing: -0.01em;
    min-height: 100dvh; -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button { font: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px calc(28px + env(safe-area-inset-bottom)); }

  /* ---------- 로그인 ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff; padding: 56px 24px 96px; text-align: center;
    background: radial-gradient(120% 80% at 80% 0%, #2563eb 0%, transparent 60%), linear-gradient(160deg, #0f172a 0%, #1e3a8a 100%);
  }
  .hero::after { /* 안전 테이프 줄무늬 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
    background: repeating-linear-gradient(-45deg, var(--orange) 0 14px, #fbbf24 14px 28px);
  }
  .badge-icon {
    width: 68px; height: 68px; margin: 0 auto 18px; border-radius: 22px; display: grid; place-items: center;
    background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .2); backdrop-filter: blur(6px);
  }
  .eyebrow { font-size: 13px; font-weight: 700; color: #93c5fd; letter-spacing: .12em; }
  .hero h1 { margin: 6px 0 8px; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
  .hero p { margin: 0; color: #cbd5e1; font-size: 15px; }
  .login-card {
    position: relative; margin: -60px auto 0; background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 22px 24px;
  }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 15px 16px; font: inherit; font-size: 17px; color: var(--text);
    background: #f8fafc; border: 1.5px solid var(--border); border-radius: 14px; outline: none; transition: border-color .15s, background .15s;
  }
  .field input:focus { border-color: var(--accent); background: #fff; }
  .msg { color: var(--bad); font-size: 14px; font-weight: 600; min-height: 1.5em; margin: 4px 2px 10px; }
  .note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px;
    font-size: 17px; font-weight: 700; border: 0; border-radius: 14px; cursor: pointer;
    color: #fff; background: var(--accent); transition: transform .08s, opacity .15s, background .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.ghost { color: var(--text); background: #fff; border: 1.5px solid var(--border); }
  .btn.dark { background: var(--navy); }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255, 255, 255, .4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 퀴즈 ---------- */
  .topbar { position: sticky; top: 0; z-index: 5; background: rgba(241, 245, 249, .9); backdrop-filter: blur(10px); padding: 14px 0 12px; }
  .topbar-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); font-weight: 600; }
  .topbar-row strong { color: var(--text); font-size: 15px; }
  .progress { height: 8px; margin-top: 10px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #60a5fa); transition: width .35s ease; }

  .qcard { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 20px; margin-top: 8px; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .qnum { display: table; margin-bottom: 12px; font-size: 13px; font-weight: 800; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 99px; }
  .qtext { padding: 0; font-size: 19px; font-weight: 700; line-height: 1.5; margin: 0 0 20px; letter-spacing: -0.02em; word-break: keep-all; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }

  .opt { position: relative; display: flex; align-items: center; gap: 12px; padding: 15px 16px; margin-bottom: 10px;
    border: 1.5px solid var(--border); border-radius: 14px; cursor: pointer; transition: border-color .15s, background .15s; font-size: 16px; word-break: keep-all; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .key { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: #f1f5f9; color: var(--muted); font-weight: 800; font-size: 14px; transition: .15s; }
  .opt:hover { border-color: #93c5fd; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:has(input:checked) .key { background: var(--accent); color: #fff; }
  .opt:has(input:focus-visible) { outline: 3px solid #93c5fd; outline-offset: 2px; }

  .ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ox .opt { flex-direction: column; justify-content: center; padding: 26px 10px; margin: 0; font-size: 15px; font-weight: 700; color: var(--muted); }
  .ox .glyph { font-size: 52px; line-height: 1; font-weight: 800; }
  .ox .o .glyph { color: #3b82f6; } .ox .x .glyph { color: #f87171; }
  .ox .o:has(input:checked) { border-color: #3b82f6; background: #eff6ff; }
  .ox .x:has(input:checked) { border-color: #ef4444; background: #fef2f2; }

  .nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 18px; }

  /* ---------- 결과 ---------- */
  .result-head { text-align: center; padding: 36px 0 8px; }
  .ring { position: relative; width: 180px; height: 180px; margin: 0 auto 18px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 14; stroke-linecap: round; }
  .ring .track { stroke: #e2e8f0; }
  .ring .bar { transition: stroke-dashoffset 1s ease .2s; }
  .ring .label { position: absolute; inset: 0; display: grid; place-content: center; }
  .ring .label b { font-size: 46px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .ring .label small { color: var(--muted); font-weight: 600; margin-top: 4px; }
  .verdict { display: inline-block; padding: 8px 18px; border-radius: 99px; font-weight: 800; font-size: 16px; }
  .verdict.pass { color: var(--ok); background: var(--ok-soft); }
  .verdict.fail { color: var(--bad); background: var(--bad-soft); }
  .result-head p { color: var(--muted); margin: 12px 0 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0; }
  .stat { background: var(--card); border-radius: 16px; padding: 14px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 24px; font-weight: 800; }
  .stat span { color: var(--muted); font-size: 13px; font-weight: 600; }
  h2 { font-size: 17px; margin: 26px 2px 12px; }
  .review { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 10px; border-left: 5px solid; }
  .review.right { border-color: var(--ok); } .review.wrong { border-color: var(--bad); }
  .review-top { display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 14px; }
  .review.right .review-top { color: var(--ok); } .review.wrong .review-top { color: var(--bad); }
  .review-q { font-weight: 600; margin: 6px 0 10px; word-break: keep-all; }
  .ans { font-size: 14px; margin: 2px 0; }
  .ans em { font-style: normal; font-weight: 700; }
  .ans.mine em { color: var(--bad); } .ans.correct em { color: var(--ok); }
  .explain { margin-top: 10px; padding: 12px 14px; background: #f8fafc; border-radius: 12px; font-size: 14px; color: #334155; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- 로그인 -->
<section id="login">
  <div class="hero">
    <div class="badge-icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <div class="eyebrow">KS-PRO SAFETY</div>
    <h1>안전 퀴즈</h1>
    <p>오늘의 안전 지식을 점검해 보세요</p>
  </div>
  <div class="wrap">
    <form id="loginForm" class="login-card">
      <label class="field"><span>사번</span><input id="id" inputmode="numeric" autocomplete="username" placeholder="사번을 입력하세요" required></label>
      <label class="field"><span>비밀번호</span><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required></label>
      <p class="msg" id="loginMsg" role="alert"></p>
      <button class="btn">시작하기</button>
    </form>
    <p class="note">환경안전이 경영의 第一 원칙입니다</p>
  </div>
</section>

<!-- 퀴즈 -->
<section id="quiz" hidden>
  <div class="wrap">
    <div class="topbar">
      <div class="topbar-row"><strong id="who"></strong><span id="count"></span></div>
      <div class="progress" role="progressbar" aria-label="진행률"><i id="bar"></i></div>
    </div>
    <div id="qbox"></div>
    <p class="msg" id="quizMsg" role="alert"></p>
    <div class="nav">
      <button class="btn ghost" id="prev" type="button">이전</button>
      <button class="btn" id="next" type="button">다음</button>
    </div>
  </div>
</section>

<!-- 결과 -->
<section id="result" hidden><div class="wrap" id="resultBox"></div></section>

<script>
// Apps Script 배포 후 받은 웹 앱 URL
const API = 'https://script.google.com/macros/s/AKfycbxk4XF3Gy3zL6dG3SsaOO_A0fvtFdziByG2lczVmEaQIweXj_2uem3khGynuoSrRDyx/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEYS = ['①', '②', '③', '④'];
let user, questions, answers, cur = 0;

async function call(body) {
  // text/plain: Apps Script가 CORS 사전요청을 처리하지 못해서
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function busy(btn, msg, fn) {
  const label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; msg.textContent = '';
  try { await fn(); }
  catch (e) { msg.textContent = e.message === 'Failed to fetch' ? '서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.' : e.message; }
  finally { btn.disabled = false; btn.innerHTML = label; }
}

function show(id) { ['login', 'quiz', 'result'].forEach(s => $(s).hidden = s !== id); scrollTo(0, 0); }

$('loginForm').onsubmit = e => {
  e.preventDefault();
  busy(e.submitter || $('loginForm').querySelector('button'), $('loginMsg'), async () => {
    user = { id: $('id').value.trim(), pw: $('pw').value.trim() };
    const d = await call({ action: 'login', ...user });
    questions = d.questions; answers = []; cur = 0;
    $('who').textContent = `${d.name}님 · 제${d.round}회차`;
    show('quiz'); render();
  });
};

function render() {
  const q = questions[cur], isOX = q.options.length === 2 && q.options[0] === 'O' && q.options[1] === 'X';
  const opts = q.options.map((o, j) => {
    const checked = answers[cur] === j + 1 ? 'checked' : '';
    return isOX
      ? `<label class="opt ${j ? 'x' : 'o'}"><input type="radio" name="a" value="${j + 1}" ${checked}><span class="glyph" aria-hidden="true">${j ? '✕' : '○'}</span>${j ? '아니다' : '맞다'}</label>`
      : `<label class="opt"><input type="radio" name="a" value="${j + 1}" ${checked}><span class="key" aria-hidden="true">${KEYS[j]}</span><span>${esc(o)}</span></label>`;
  }).join('');
  $('qbox').innerHTML = `<div class="qcard"><fieldset>
    <legend class="qtext"><span class="qnum">Q${cur + 1}</span>${esc(q.q)}</legend>
    <div class="${isOX ? 'ox' : ''}">${opts}</div></fieldset></div>`;
  $('qbox').querySelectorAll('input').forEach(i => i.onchange = () => { answers[cur] = Number(i.value); update(); });
  $('quizMsg').textContent = '';
  update();
}

function update() {
  const done = answers.filter(Boolean).length, last = cur === questions.length - 1;
  $('count').textContent = `${cur + 1} / ${questions.length}`;
  $('bar').style.width = `${done / questions.length * 100}%`;
  $('prev').disabled = cur === 0;
  $('next').disabled = !answers[cur];
  $('next').textContent = last ? '제출하기' : '다음';
  $('next').classList.toggle('dark', last);
}

$('prev').onclick = () => { cur--; render(); };
$('next').onclick = () => {
  if (cur < questions.length - 1) { cur++; render(); return; }
  const missing = questions.findIndex((_, i) => !answers[i]);
  if (missing >= 0) { cur = missing; render(); $('quizMsg').textContent = `${missing + 1}번 문제에 답해 주세요.`; return; }
  if (!confirm('답안을 제출할까요? 제출 후에는 수정할 수 없습니다.')) return;
  busy($('next'), $('quizMsg'), async () => {
    const d = await call({ action: 'submit', ...user, answers: questions.map((_, i) => answers[i]) });
    renderResult(d);
  });
};

function renderResult(d) {
  const right = d.review.filter(r => r.ok).length, C = 2 * Math.PI * 76;
  const color = d.pass ? 'var(--ok)' : 'var(--bad)';
  $('resultBox').innerHTML = `
    <div class="result-head">
      <div class="ring">
        <svg width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
          <circle class="track" cx="90" cy="90" r="76"/>
          <circle class="bar" id="ringBar" cx="90" cy="90" r="76" stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
        </svg>
        <div class="label"><b style="color:${color}">${d.score}</b><small>점</small></div>
      </div>
      <span class="verdict ${d.pass ? 'pass' : 'fail'}">${d.pass ? '🎉 합격' : '불합격'}</span>
      <p>${d.pass ? '수고하셨습니다! 오늘도 안전한 하루 되세요.' : '아래 해설을 확인하고 다시 응시해 주세요.'}</p>
    </div>
    <div class="stats">
      <div class="stat"><b style="color:var(--ok)">${right}</b><span>맞힌 문제</span></div>
      <div class="stat"><b style="color:var(--bad)">${d.review.length - right}</b><span>틀린 문제</span></div>
    </div>
    <h2>문제별 해설</h2>
    ${d.review.map((r, i) => {
      const q = questions[i], opt = n => esc(q.options[n - 1] ?? n);
      return `<div class="review ${r.ok ? 'right' : 'wrong'}">
        <div class="review-top">${r.ok ? '✓ 정답' : '✕ 오답'} <span style="color:var(--muted);font-weight:600">· Q${i + 1}</span></div>
        <div class="review-q">${esc(q.q)}</div>
        ${r.ok ? '' : `<div class="ans mine">내 답: <em>${opt(answers[i])}</em></div>`}
        <div class="ans correct">정답: <em>${opt(r.answer)}</em></div>
        ${r.explain ? `<div class="explain">${esc(r.explain)}</div>` : ''}
      </div>`;
    }).join('')}
    <button class="btn dark" style="margin-top:18px" onclick="location.reload()">처음으로</button>`;
  show('result');
  requestAnimationFrame(() => requestAnimationFrame(() => $('ringBar').style.strokeDashoffset = C * (1 - d.score / 100)));
}
</script>
</body>
</html>
