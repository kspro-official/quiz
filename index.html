<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>KS-PRO 안전 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css">
<style>
  /* 레퍼런스: Duolingo(입체 버튼·두꺼운 테두리·진행바·완료 화면), Kahoot(보기별 색과 도형) */
  :root {
    --text: #4b4b4b; --strong: #3c3c3c; --muted: #777; --soft: #afafaf;
    --line: #e5e5e5; --line-strong: #d4d4d4; --bg-alt: #f7f7f7;
    --blue: #1cb0f6; --blue-dark: #1899d6; --navy: #1e3a8a;
    --green: #58cc02; --green-dark: #46a302; --green-tint: #d7ffb8;
    --red: #ff4b4b; --red-dark: #e02e2e; --red-tint: #ffe5e5;
    --gold: #ffc800; --gold-dark: #cc9f00; --orange: #ff9600;
    --k-red: #e21b3c; --k-blue: #1368ce; --k-yellow: #d89e00; --k-green: #26890c;
    --display: "NanumSquareRoundEB", "Pretendard Variable", sans-serif;
    --bold: "NanumSquareRoundB", "Pretendard Variable", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; color: var(--text); line-height: 1.55; min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button { font: inherit; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 20px; }

  /* 입체 버튼 (Duolingo: 블러 없는 아래 그림자, 누르면 내려앉음) */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 13px 20px;
    font-family: var(--bold); font-size: 17px; letter-spacing: .02em; color: #fff; background: var(--blue);
    border: 0; border-radius: 16px; box-shadow: 0 4px 0 var(--blue-dark); cursor: pointer; transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--blue-dark); }
  .btn:disabled { color: var(--soft); background: var(--line); box-shadow: 0 4px 0 var(--line-strong); cursor: default; filter: none; transform: none; }
  .btn.green { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
  .btn.green:active { box-shadow: 0 0 0 var(--green-dark); }
  .btn.ghost { color: var(--blue); background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
  .btn.ghost:active { box-shadow: 0 0 0 var(--line); }
  .btn.ghost:disabled { color: var(--line-strong); background: #fff; }
  .btn:focus-visible, .opt:has(input:focus-visible), .icon-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: var(--red-dark); font-size: 14px; font-weight: 700; min-height: 1.5em; margin: 6px 2px 12px; text-align: center; }

  /* ---------- 로그인 (Duolingo 시작 화면) ---------- */
  #login .wrap { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding-top: 32px; padding-bottom: 32px; }
  .mascot { width: 150px; margin: 0 auto 10px; display: block; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .brand { text-align: center; font-family: var(--bold); color: var(--navy); font-size: 14px; letter-spacing: .18em; }
  .title { text-align: center; font-family: var(--display); color: var(--strong); font-size: 34px; margin: 4px 0 6px; letter-spacing: -0.01em; }
  .lead { text-align: center; color: var(--muted); font-size: 16px; margin: 0 0 30px; }
  .field { display: block; margin-bottom: 12px; }
  .field input {
    width: 100%; padding: 15px 16px; font: inherit; font-size: 17px; color: var(--strong);
    background: var(--bg-alt); border: 2px solid var(--line); border-radius: 16px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field input::placeholder { color: var(--soft); }
  .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(28,176,246,.25); background: #fff; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; margin-top: 26px; }

  /* ---------- 퀴즈 ---------- */
  .top { position: sticky; top: 0; z-index: 5; background: #fff; display: flex; align-items: center; gap: 14px; padding: 18px 0 14px; }
  .icon-btn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; color: var(--soft); border-radius: 10px; cursor: pointer; }
  .icon-btn:hover { color: var(--muted); background: var(--bg-alt); }
  .bar { flex: 1; height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { position: relative; display: block; height: 100%; width: 0; min-width: 16px; background: var(--green); border-radius: 99px; transition: width .35s cubic-bezier(.34,1.56,.64,1); }
  .bar i::after { content: ""; position: absolute; top: 4px; left: 8px; right: 8px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.3); }
  .count { flex: none; font-family: var(--bold); color: var(--soft); font-size: 15px; min-width: 44px; text-align: right; }

  .stage { padding: 14px 0 150px; animation: slide .28s ease; }
  @keyframes slide { from { opacity: 0; transform: translateX(18px); } }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .eyebrow { display: flex; align-items: center; gap: 6px; font-family: var(--bold); font-size: 14px; color: #ce82ff; margin-bottom: 10px; }
  .eyebrow.ox { color: var(--orange); }
  .qtext { padding: 0; font-family: var(--display); color: var(--strong); font-size: 23px; line-height: 1.45; margin: 0 0 26px; word-break: keep-all; }

  /* 4지선다: Kahoot 도형·색 + Duolingo 카드 */
  .opt { --c: var(--k-blue); position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 12px;
    background: #fff; border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 4px 0 var(--line);
    font-size: 17px; font-weight: 600; color: var(--strong); cursor: pointer; word-break: keep-all; transition: transform .08s, box-shadow .08s, background .15s, border-color .15s; }
  .opt:nth-child(1) { --c: var(--k-red); } .opt:nth-child(2) { --c: var(--k-blue); }
  .opt:nth-child(3) { --c: var(--k-yellow); } .opt:nth-child(4) { --c: var(--k-green); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt:hover { background: var(--bg-alt); }
  .opt:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
  .shape { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--c); }
  .shape svg { width: 22px; height: 22px; fill: #fff; }
  .opt:has(input:checked) { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, #fff); box-shadow: 0 4px 0 var(--c); }
  .opt .check { margin-left: auto; flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
  .opt:has(input:checked) .check { background: var(--c); border-color: var(--c); }
  .opt:has(input:checked) .check::after { content: ""; width: 10px; height: 6px; border: 3px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

  /* O/X: Kahoot 참/거짓 타일 */
  .ox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ox-grid .opt { flex-direction: column; justify-content: center; gap: 6px; margin: 0; padding: 30px 10px 22px; border: 0; color: #fff; font-family: var(--bold); font-size: 17px; }
  .ox-grid .opt.o { background: var(--k-blue); box-shadow: 0 6px 0 #0d4f9e; }
  .ox-grid .opt.x { background: var(--k-red); box-shadow: 0 6px 0 #a8122b; }
  .ox-grid .opt:active { transform: translateY(6px); box-shadow: none; }
  .ox-grid .glyph { width: 64px; height: 64px; }
  .ox-grid:has(input:checked) .opt:not(:has(input:checked)) { opacity: .35; }
  .ox-grid .opt:has(input:checked) { outline: 4px solid var(--strong); outline-offset: 3px; }

  .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 2px solid var(--line); padding: 16px 0 calc(16px + env(safe-area-inset-bottom)); }
  .actions .wrap { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
  .actions .msg { grid-column: 1 / -1; margin: 0; min-height: 0; }
  .actions .msg:empty { display: none; }

  /* ---------- 결과 (Duolingo 레슨 완료 화면) ---------- */
  .done { text-align: center; padding: 44px 0 6px; }
  .trophy { width: 120px; margin: 0 auto 8px; display: block; animation: pop .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .done h1 { font-family: var(--display); font-size: 30px; margin: 6px 0 4px; }
  .done.pass h1 { color: var(--gold-dark); } .done.fail h1 { color: var(--red); }
  .done p { margin: 0; color: var(--muted); font-size: 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 26px 0 8px; }
  .stat { --c: var(--gold); text-align: center; border: 2px solid var(--c); border-radius: 16px; background: var(--c); overflow: hidden; }
  .stat .label { display: block; padding: 5px 4px 4px; color: #fff; font-family: var(--bold); font-size: 12px; letter-spacing: .06em; }
  .stat .value { display: block; margin: 0 2px 2px; padding: 12px 4px; background: #fff; border-radius: 13px; font-family: var(--display); font-size: 24px; color: var(--c); }
  .stat.green { --c: var(--green); } .stat.blue { --c: var(--blue); } .stat.red { --c: var(--red); }
  h2 { font-family: var(--display); color: var(--strong); font-size: 20px; margin: 30px 0 14px; }
  .review { border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; border-left-width: 6px; }
  .review.right { border-left-color: var(--green); } .review.wrong { border-left-color: var(--red); }
  .review-top { display: flex; align-items: center; gap: 8px; font-family: var(--bold); font-size: 15px; }
  .review.right .review-top { color: var(--green-dark); } .review.wrong .review-top { color: var(--red-dark); }
  .review-top .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; }
  .review.right .dot { background: var(--green); } .review.wrong .dot { background: var(--red); }
  .review-top .qn { color: var(--soft); margin-left: auto; }
  .review-q { color: var(--strong); font-weight: 600; margin: 8px 0 10px; word-break: keep-all; }
  .ans { font-size: 15px; margin: 3px 0; }
  .ans b { font-weight: 700; }
  .ans.mine b { color: var(--red-dark); } .ans.correct b { color: var(--green-dark); }
  .explain { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bg-alt); font-size: 14px; color: var(--text); }
  .result-actions { padding: 18px 0 calc(28px + env(safe-area-inset-bottom)); }

  /* ---------- 홈 (Duolingo 유닛 카드·설정 목록) ---------- */
  .home-top { display: flex; align-items: center; gap: 12px; padding: 22px 0 18px; }
  .avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-family: var(--display); font-size: 20px; box-shadow: 0 3px 0 var(--blue-dark); }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-family: var(--display); color: var(--strong); font-size: 19px; }
  .who span { color: var(--muted); font-size: 14px; }
  .link { border: 0; background: none; color: var(--blue); font-family: var(--bold); font-size: 15px; cursor: pointer; padding: 8px; }
  .callout { display: flex; gap: 12px; align-items: center; padding: 14px 16px; margin-bottom: 16px; border-radius: 16px; background: #fff4dd; border: 2px solid #ffd99a; color: #8a5300; font-size: 15px; font-weight: 600; }
  .callout .link { margin-left: auto; color: var(--orange); flex: none; }
  .unit { position: relative; overflow: hidden; border-radius: 20px; padding: 22px 20px 20px; color: #fff; background: var(--green); box-shadow: 0 5px 0 var(--green-dark); }
  .unit::after { content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .unit small { font-family: var(--bold); font-size: 13px; letter-spacing: .08em; opacity: .9; }
  .unit h2 { margin: 4px 0 4px; color: #fff; font-size: 24px; }
  .unit p { margin: 0 0 18px; font-weight: 600; opacity: .95; }
  .unit .status { display: inline-block; margin: -6px 0 16px; padding: 4px 12px; border-radius: 99px; background: rgba(255,255,255,.22); font-weight: 700; font-size: 14px; }
  .btn.white { color: var(--green-dark); background: #fff; box-shadow: 0 4px 0 #dcdcdc; }
  .btn.white:active { box-shadow: 0 0 0 #dcdcdc; }
  .btn.white .spinner { border-color: rgba(70,163,2,.3); border-top-color: var(--green-dark); }
  .menu { margin: 22px 0 8px; display: grid; gap: 12px; }
  .menu-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 4px 0 var(--line); cursor: pointer; font-family: var(--bold); font-size: 17px; color: var(--strong); transition: transform .08s, box-shadow .08s; }
  .menu-item:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
  .menu-item .ico { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
  .menu-item .ico svg { width: 22px; height: 22px; }
  .menu-item small { display: block; font-family: "Pretendard Variable", sans-serif; font-weight: 500; font-size: 14px; color: var(--muted); }
  .menu-item .chev { margin-left: auto; color: var(--soft); }

  /* ---------- 하위 화면 (비밀번호 변경·이전 기록) ---------- */
  .sub-top { display: flex; align-items: center; gap: 8px; padding: 18px 0 8px; }
  .sub-top h1 { margin: 0; font-family: var(--display); color: var(--strong); font-size: 21px; }
  .sub-lead { color: var(--muted); margin: 4px 0 20px; }
  .field .hint { display: block; margin: 6px 4px 0; color: var(--muted); font-size: 13px; }
  .hist { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 10px; border: 2px solid var(--line); border-radius: 16px; }
  .hist .score { flex: none; width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-size: 20px; color: #fff; }
  .hist.pass .score { background: var(--green); } .hist.fail .score { background: var(--red); }
  .hist b { display: block; color: var(--strong); font-family: var(--bold); font-size: 16px; }
  .hist span { color: var(--muted); font-size: 14px; }
  .badge { margin-left: auto; flex: none; padding: 4px 10px; border-radius: 99px; font-family: var(--bold); font-size: 13px; }
  .hist.pass .badge { color: var(--green-dark); background: var(--green-tint); } .hist.fail .badge { color: var(--red-dark); background: var(--red-tint); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .empty svg { width: 110px; display: block; margin: 0 auto 10px; opacity: .8; }
  .toast { position: fixed; left: 50%; bottom: 28px; z-index: 20; transform: translateX(-50%); padding: 12px 20px; border-radius: 14px; background: var(--strong); color: #fff; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.2); animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } }

  /* ---------- 회사 정보 ---------- */
  body { display: flex; flex-direction: column; }
  .unit .msg:empty { display: none; }
  section:not([hidden]) { padding-bottom: 36px; }
  .site-foot { margin-top: auto; padding: 26px 0 calc(30px + env(safe-area-inset-bottom)); border-top: 2px solid var(--line); background: var(--bg-alt); color: var(--muted); font-size: 14px; }
  .site-foot .co { font-family: var(--display); color: var(--strong); font-size: 18px; }
  .site-foot .co small { font-family: var(--bold); color: var(--navy); font-size: 13px; margin-left: 6px; }
  .site-foot dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 12px 0 14px; }
  .site-foot dt { color: var(--soft); font-weight: 600; } .site-foot dd { margin: 0; color: var(--text); }
  .site-foot a { color: var(--text); text-decoration: none; } .site-foot a:hover { text-decoration: underline; }
  .site-foot .more { display: inline-block; color: var(--blue); font-family: var(--bold); }
  .site-foot .copy { margin-top: 14px; color: var(--soft); font-size: 12px; }
  #login .wrap { min-height: auto; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .btn:active, .opt:active { transform: none; opacity: .85; } }
</style>
</head>
<body>

<!-- 공통 도형 (Kahoot 보기 도형: ▲ ◆ ● ■) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s1" viewBox="0 0 24 24"><path d="M12 3 22.5 21h-21z"/></symbol>
  <symbol id="s2" viewBox="0 0 24 24"><path d="M12 1.5 22.5 12 12 22.5 1.5 12z"/></symbol>
  <symbol id="s3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5"/></symbol>
  <symbol id="s4" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="2"/></symbol>
  <symbol id="hat" viewBox="0 0 160 120">
    <ellipse cx="80" cy="112" rx="56" ry="6" fill="#e5e5e5"/>
    <path d="M28 78a52 52 0 0 1 104 0z" fill="#ffc800"/>
    <path d="M28 78a52 52 0 0 1 104 0h-12a40 40 0 0 0-80 0z" fill="#ffd94d"/>
    <rect x="70" y="30" width="20" height="48" rx="8" fill="#ff9600"/>
    <rect x="12" y="76" width="136" height="18" rx="9" fill="#ff9600"/>
    <rect x="12" y="76" width="136" height="7" rx="3.5" fill="#ffb340"/>
    <path d="M40 58l7 7 14-14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  </symbol>
</svg>

<!-- 로그인 -->
<section id="login">
  <div class="wrap">
    <svg class="mascot" viewBox="0 0 160 120" role="img" aria-label="안전모"><use href="#hat"/></svg>
    <div class="brand">KS-PRO SAFETY</div>
    <h1 class="title">안전 퀴즈</h1>
    <p class="lead">오늘의 안전 지식을 점검해 볼까요?</p>
    <form id="loginForm">
      <label class="field"><input id="name" autocomplete="username" placeholder="이름" aria-label="이름" required></label>
      <label class="field"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required></label>
      <p class="msg" id="loginMsg" role="alert"></p>
      <button class="btn">로그인</button>
    </form>
      </div>
</section>

<!-- 홈 -->
<section id="home" hidden>
  <div class="wrap">
    <div class="home-top">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="who"><b id="hName"></b><span id="hDept"></span></div>
      <button class="link" id="logout" type="button">로그아웃</button>
    </div>
    <div class="callout" id="pwWarn" hidden>초기 비밀번호를 쓰고 있어요.<button class="link" type="button" data-go="pwPage">변경하기</button></div>
    <div class="unit">
      <small>KS-PRO 안전 퀴즈</small>
      <h2 id="uTitle"></h2>
      <p id="uInfo"></p>
      <div class="status" id="uStatus"></div>
      <p class="msg" id="homeMsg" role="alert" style="color:#fff"></p>
      <button class="btn white" id="startBtn" type="button">응시하기</button>
    </div>
    <div class="menu">
      <button class="menu-item" type="button" data-go="histPage"><span class="ico" style="background:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span>이전 기록<small id="hCount"></small></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="menu-item" type="button" data-go="pwPage"><span class="ico" style="background:#ce82ff"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span>비밀번호 변경<small>로그인 비밀번호를 바꿔요</small></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
  </div>
</section>

<!-- 비밀번호 변경 -->
<section id="pwPage" hidden>
  <div class="wrap">
    <div class="sub-top"><button class="icon-btn" type="button" data-home aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><h1>비밀번호 변경</h1></div>
    <p class="sub-lead">다음 로그인부터 새 비밀번호를 사용해요.</p>
    <form id="pwForm">
      <label class="field"><input id="pwCur" type="password" autocomplete="current-password" placeholder="현재 비밀번호" aria-label="현재 비밀번호" required></label>
      <label class="field"><input id="pwNew" type="password" autocomplete="new-password" placeholder="새 비밀번호" aria-label="새 비밀번호" minlength="4" required><span class="hint">4자 이상, 초기 비밀번호(0000)는 쓸 수 없어요.</span></label>
      <label class="field"><input id="pwNew2" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인" aria-label="새 비밀번호 확인" required></label>
      <p class="msg" id="pwMsg" role="alert"></p>
      <button class="btn">변경하기</button>
    </form>
  </div>
</section>

<!-- 이전 기록 -->
<section id="histPage" hidden>
  <div class="wrap">
    <div class="sub-top"><button class="icon-btn" type="button" data-home aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><h1>이전 기록</h1></div>
    <div id="histList"></div>
  </div>
</section>

<!-- 퀴즈 -->
<section id="quiz" hidden>
  <div class="wrap">
    <div class="top">
      <button class="icon-btn" id="quit" type="button" aria-label="그만두기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>
      </button>
      <div class="bar" role="progressbar" aria-label="진행률"><i id="bar"></i></div>
      <span class="count" id="count"></span>
    </div>
    <div id="qbox"></div>
  </div>
  <div class="actions">
    <div class="wrap">
      <p class="msg" id="quizMsg" role="alert"></p>
      <button class="btn ghost" id="prev" type="button">이전</button>
      <button class="btn" id="next" type="button">다음</button>
    </div>
  </div>
</section>

<!-- 결과 -->
<section id="result" hidden><div class="wrap" id="resultBox"></div></section>

<footer class="site-foot" id="siteFoot">
  <div class="wrap">
    <div class="co">KS-PRO<small>글로벌 안전관리 전문 기업</small></div>
    <dl>
      <dt>대표</dt><dd>최미영</dd>
      <dt>전화</dt><dd><a href="tel:010-7928-3008">010-7928-3008</a></dd>
      <dt>이메일</dt><dd><a href="mailto:Ks.pro3008@gmail.com">Ks.pro3008@gmail.com</a></dd>
      <dt>분야</dt><dd>국내·외 현장 안전관리</dd>
    </dl>
    <a class="more" href="https://kspro-official.github.io/kspro/">회사 소개 보기 →</a>
    <div class="copy">© KS-PRO. 환경안전이 경영의 第一 원칙입니다.</div>
  </div>
</footer>

<script>
// Apps Script 배포 후 받은 웹 앱 URL
const API = 'https://script.google.com/macros/s/AKfycbxk4XF3Gy3zL6dG3SsaOO_A0fvtFdziByG2lczVmEaQIweXj_2uem3khGynuoSrRDyx/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isOX = q => q.options.length === 2 && q.options[0] === 'O' && q.options[1] === 'X';
let user, me, questions, answers, cur = 0;

async function call(body) {
  // text/plain: Apps Script가 CORS 사전요청을 처리하지 못해서
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function busy(btn, msg, fn) {
  const label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; msg.textContent = '';
  try { await fn(); }
  catch (e) { msg.textContent = e.message === 'Failed to fetch' ? '서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.' : e.message; }
  finally { btn.disabled = false; btn.innerHTML = label; }
}

const PAGES = ['login', 'home', 'pwPage', 'histPage', 'quiz', 'result'];
function show(id) { PAGES.forEach(s => $(s).hidden = s !== id); $('siteFoot').hidden = id === 'quiz'; scrollTo(0, 0); }
function toast(text) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.body.append(t); setTimeout(() => t.remove(), 2200); }
const fmt = t => { const d = new Date(t); return isNaN(d) ? String(t) : `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

async function loadHome() { me = await call({ action: 'login', ...user }); renderHome(); show('home'); }

function renderHome() {
  const mine = me.history.filter(h => String(h.round) === String(me.round));
  const best = mine.length ? Math.max(...mine.map(h => h.score)) : null;
  $('avatar').textContent = String(me.name).slice(0, 1);
  $('hName').textContent = `${me.name}님`;
  $('hDept').textContent = me.dept || '';
  $('pwWarn').hidden = !me.defaultPw;
  $('uTitle').textContent = `제${me.round}회차 안전 퀴즈`;
  $('uInfo').textContent = me.total ? `${me.total}문항 · ${me.passScore}점 이상 합격` : '지금은 진행 중인 퀴즈가 없어요';
  $('uStatus').textContent = best === null ? '아직 응시하지 않았어요' : mine.some(h => h.pass) ? `합격 완료 · 최고 ${best}점` : `최고 ${best}점 · 다시 도전해 보세요`;
  $('startBtn').textContent = best === null ? '응시하기' : '다시 응시하기';
  $('startBtn').disabled = !me.total;
  $('hCount').textContent = me.history.length ? `지금까지 ${me.history.length}번 응시했어요` : '아직 기록이 없어요';
  $('homeMsg').textContent = '';
}

function renderHistory() {
  $('histList').innerHTML = me.history.length ? me.history.map(h => `
    <div class="hist ${h.pass ? 'pass' : 'fail'}"><div class="score">${h.score}</div>
      <div><b>제${esc(h.round)}회차</b><span>${fmt(h.time)}</span></div><span class="badge">${h.pass ? '합격' : '불합격'}</span></div>`).join('')
    : '<div class="empty"><svg viewBox="0 0 160 120" aria-hidden="true"><use href="#hat"/></svg>아직 응시 기록이 없어요.</div>';
}

document.querySelectorAll('[data-home]').forEach(b => b.onclick = () => { renderHome(); show('home'); });
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  if (b.dataset.go === 'histPage') renderHistory();
  if (b.dataset.go === 'pwPage') { $('pwForm').reset(); $('pwMsg').textContent = ''; }
  show(b.dataset.go);
});
$('logout').onclick = () => location.reload();

$('startBtn').onclick = () => busy($('startBtn'), $('homeMsg'), async () => {
  questions = (await call({ action: 'start', ...user })).questions; answers = []; cur = 0;
  show('quiz'); render();
});

$('pwForm').onsubmit = e => {
  e.preventDefault();
  if ($('pwNew').value.trim() !== $('pwNew2').value.trim()) { $('pwMsg').textContent = '새 비밀번호가 서로 달라요.'; return; }
  busy($('pwForm').querySelector('button'), $('pwMsg'), async () => {
    await call({ action: 'changePw', name: user.name, pw: $('pwCur').value.trim(), newPw: $('pwNew').value.trim() });
    user.pw = $('pwNew').value.trim(); me.defaultPw = false;
    renderHome(); show('home'); toast('비밀번호를 변경했어요');
  });
};

$('loginForm').onsubmit = e => {
  e.preventDefault();
  busy($('loginForm').querySelector('button'), $('loginMsg'), async () => {
    user = { name: $('name').value.trim(), pw: $('pw').value.trim() };
    await loadHome();
  });
};

$('quit').onclick = () => { if (confirm('퀴즈를 그만둘까요? 푼 내용은 저장되지 않아요.')) { renderHome(); show('home'); } };

function render() {
  const q = questions[cur], ox = isOX(q);
  const opts = q.options.map((o, j) => {
    const checked = answers[cur] === j + 1 ? 'checked' : '';
    return ox
      ? `<label class="opt ${j ? 'x' : 'o'}"><input type="radio" name="a" value="${j + 1}" ${checked}>
           <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" aria-hidden="true">${j ? '<path d="M5 5l14 14M19 5 5 19"/>' : '<circle cx="12" cy="12" r="8"/>'}</svg>
           ${j ? '아니다' : '맞다'}</label>`
      : `<label class="opt"><input type="radio" name="a" value="${j + 1}" ${checked}>
           <span class="shape" aria-hidden="true"><svg><use href="#s${j + 1}"/></svg></span>
           <span>${esc(o)}</span><span class="check" aria-hidden="true"></span></label>`;
  }).join('');
  $('qbox').innerHTML = `<div class="stage"><fieldset>
    <legend class="qtext"><div class="eyebrow ${ox ? 'ox' : ''}">${ox ? 'O/X 문제' : '알맞은 답을 고르세요'}</div>${esc(q.q)}</legend>
    <div class="${ox ? 'ox-grid' : ''}">${opts}</div></fieldset></div>`;
  $('qbox').querySelectorAll('input').forEach(i => i.onchange = () => { answers[cur] = Number(i.value); update(); });
  $('quizMsg').textContent = '';
  update();
}

function update() {
  const last = cur === questions.length - 1;
  $('count').textContent = `${cur + 1}/${questions.length}`;
  $('bar').style.width = `${answers.filter(Boolean).length / questions.length * 100}%`;
  $('prev').disabled = cur === 0;
  $('next').disabled = !answers[cur];
  $('next').textContent = last ? '제출하기' : '다음';
  $('next').classList.toggle('green', last);
}

$('prev').onclick = () => { cur--; render(); };
$('next').onclick = () => {
  if (cur < questions.length - 1) { cur++; render(); return; }
  const missing = questions.findIndex((_, i) => !answers[i]);
  if (missing >= 0) { cur = missing; render(); $('quizMsg').textContent = `${missing + 1}번 문제에 답해 주세요.`; return; }
  if (!confirm('답안을 제출할까요? 제출 후에는 수정할 수 없어요.')) return;
  busy($('next'), $('quizMsg'), async () => {
    renderResult(await call({ action: 'submit', ...user, answers: questions.map((_, i) => answers[i]) }));
  });
};

function renderResult(d) {
  const right = d.review.filter(r => r.ok).length;
  const label = (q, n) => isOX(q) ? (n === 1 ? 'O (맞다)' : 'X (아니다)') : esc(q.options[n - 1] ?? n);
  $('resultBox').innerHTML = `
    <div class="done ${d.pass ? 'pass' : 'fail'}">
      ${d.pass
        ? '<svg class="trophy" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 18h60v22a30 30 0 0 1-60 0z" fill="#ffc800"/><path d="M30 26H16a14 14 0 0 0 14 22M90 26h14a14 14 0 0 1-14 22" fill="none" stroke="#ffc800" stroke-width="7"/><rect x="52" y="68" width="16" height="18" fill="#ff9600"/><rect x="36" y="86" width="48" height="14" rx="5" fill="#ff9600"/><path d="M60 26l5 10 11 1.6-8 7.8 1.9 11L60 51l-9.9 5.4 1.9-11-8-7.8L55 36z" fill="#fff" opacity=".9"/></svg>'
        : '<svg class="trophy" viewBox="0 0 160 120" aria-hidden="true"><use href="#hat"/></svg>'}
      <h1>${d.pass ? '합격이에요!' : '조금만 더 힘내요!'}</h1>
      <p>${d.pass ? '수고하셨습니다. 오늘도 안전한 하루 되세요.' : '해설을 확인하고 다시 도전해 주세요.'}</p>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">점수</span><span class="value">${d.score}</span></div>
      <div class="stat green"><span class="label">정답</span><span class="value">${right}/${d.review.length}</span></div>
      <div class="stat ${d.pass ? 'blue' : 'red'}"><span class="label">결과</span><span class="value">${d.pass ? '합격' : '불합격'}</span></div>
    </div>
    <h2>문제별 해설</h2>
    ${d.review.map((r, i) => `
      <div class="review ${r.ok ? 'right' : 'wrong'}">
        <div class="review-top"><span class="dot" aria-hidden="true">${r.ok ? '✓' : '✕'}</span>${r.ok ? '정답' : '오답'}<span class="qn">Q${i + 1}</span></div>
        <div class="review-q">${esc(questions[i].q)}</div>
        ${r.ok ? '' : `<div class="ans mine">내 답: <b>${label(questions[i], answers[i])}</b></div>`}
        <div class="ans correct">정답: <b>${label(questions[i], r.answer)}</b></div>
        ${r.explain ? `<div class="explain"><b>해설</b> ${esc(r.explain)}</div>` : ''}
      </div>`).join('')}
    <p class="msg" id="resultMsg" role="alert"></p>
    <div class="result-actions"><button class="btn" id="homeBtn" type="button">홈으로</button></div>`;
  $('homeBtn').onclick = () => busy($('homeBtn'), $('resultMsg'), loadHome);
  show('result');
}
</script>
</body>
</html>
